<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="charmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#charmGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Letter C in Modern Bold Serif/Sans (CHARM) -->
  <path d="M 43 23 
           C 40 18.5, 34.5 16, 28 16 
           C 18.5 16, 12 23, 12 32 
           C 12 41, 18.5 48, 28 48 
           C 34.5 48, 40 45.5, 43 41" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="7" 
        stroke-linecap="round" 
        filter="url(#glow)"/>

  <!-- Sparkling Star / Halal Purity Badge on the upper right -->
  <!-- 4-pointed Star -->
  <path d="M 46 8 
           Q 46 17 55 17 
           Q 46 17 46 26 
           Q 46 17 37 17 
           Q 46 17 46 8 Z" 
        fill="url(#goldGrad)" 
        filter="url(#glow)"/>

  <!-- Smaller Accent Sparkle -->
  <circle cx="36" cy="11" r="1.8" fill="#FEF08A" />
</svg>
